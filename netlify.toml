[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so /report and /dashboard resolve on direct load / refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
