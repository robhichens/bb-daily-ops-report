[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirects (including /api/* -> functions and the SPA fallback) live in
# public/_redirects, not here — a _redirects file always wins over
# netlify.toml [[redirects]], so keeping both was silently no-op-ing this one.
